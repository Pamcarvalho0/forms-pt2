<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>Lista de Gadgets</title>
        <link rel="stylesheet" href="../css/get.css" />
        <script src="../js/get.js" defer></script> 
    </head>
    <body>
        <header>
            <h1>Lista de Gadgets</h1>
            <p>Esta página exibe a lista de Gadgets cadastrados.</p>
        </header>
        <main>
            <p><a href="../index.html">Cadastrar novo Gadget</a></p>
        </main>
         <template id="modelo-gadget">
      <li>
        <section class="card-capa">
          <img class="imagem-gadget" alt="" />
        </section>
        <section class="card-conteudo">
          <h3 class="nome"></h3>
          <p><strong>Poder:</strong> <span class="poder"> </span></p>
          <p><strong>Categoria:</strong> <span class="categoria"> </span></p>
          <p><strong>Marca:</strong> <span class="marca"> </span></p>
          <p><strong>Preço:</strong> <span class="preco"> </span></p>
          <p><strong>Ano de lançamento:</strong> <span class="ano_lancamento"> </span></p>
        </section>
      </li>
    </template>
    </body>
</html>
